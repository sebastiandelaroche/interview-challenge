server {
  listen 5173;
  root /usr/share/nginx/html;
  index index.html;

  # Mirrors the Vite dev proxy: /api/* -> api:3000/*
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
  }

  # SPA fallback for client-side routes.
  location / {
    try_files $uri /index.html;
  }
}
