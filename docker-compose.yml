name: interview-challenge

services:
  postgres:
    image: postgres:latest
    container_name: postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: pass123
      POSTGRES_DB: ticket_reservation
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d ticket_reservation"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: pass123
      MONGO_INITDB_DATABASE: ticket_reservation
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: api
    environment: &api-env
      PORT: 3000
      POSTGRES_URL: postgresql://root:pass123@postgres:5432/ticket_reservation?schema=public
      MONGO_URL: mongodb://root:pass123@mongo:27017/ticket_reservation?authSource=admin
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/events"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One-shot: runs the (idempotent) Prisma seed once the API is up and has
  # applied migrations, then exits. Re-run with `docker compose run --rm seed`.
  seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: *api-env
    command: ["npx", "prisma", "db", "seed"]
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

  web-app:
    build:
      context: .
      dockerfile: apps/web-app/Dockerfile
    container_name: web-app
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  mongo_data:
